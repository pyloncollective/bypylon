<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PYLON</title>
  <meta name="description" content="Pylon Collective — commercial production, creative agency, director roster.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;800&family=Bebas+Neue&family=IBM+Plex+Mono:wght@500&family=Playfair+Display:ital,wght@1,700&family=Syne:wght@800&family=Unbounded:wght@900&display=block" rel="stylesheet">
  <link rel="preload" as="image" href="assets/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-loading">

  <!-- ============================================================
       INTRO LOADER — logo flash sequence (Paragon-style)
       Sequence is driven by js/main.js -> LOGOS array.
       ============================================================ -->
  <div id="intro" aria-hidden="true">
    <div class="intro-stage" id="introStage"></div>
    <div class="intro-curtain" id="introCurtain"></div>
  </div>

  <!-- Hidden logo library. main.js clones these into the stage in order. -->
  <template id="logoLibrary">

    <!-- 01 · ORIGINAL -->
    <div class="logo" data-id="original">
      <img src="assets/logo.png" alt="" class="logo-original">
    </div>

    <!-- 02 · Spaced serif wordmark w/ boxed icon -->
    <div class="logo" data-id="serif-spaced">
      <div class="lg-serif-spaced"><span class="box">&#9650;</span><span>P</span><span>Y</span><span>L</span><span>O</span><span>N</span></div>
    </div>

    <!-- 03 · Racing italic + speed slashes -->
    <div class="logo" data-id="racing">
      <div class="lg-racing">PYLON<i></i><i></i><i></i></div>
    </div>

    <!-- 04 · Circle badge -->
    <div class="logo" data-id="badge-pyln">
      <div class="lg-badge"><span>Pyln</span></div>
    </div>

    <!-- 05 · Editorial italic stack -->
    <div class="logo" data-id="editorial">
      <div class="lg-editorial">Pylon<small>COLLECTIVE</small></div>
    </div>

    <!-- 06 · Track oval -->
    <div class="logo" data-id="track">
      <div class="lg-track"><span>PYLN'S</span></div>
    </div>

    <!-- 07 · Cone icon -->
    <div class="logo" data-id="cone">
      <div class="lg-cone">
        <svg viewBox="0 0 100 100" width="84" height="84"><path d="M42 8h16l26 76H16z" fill="#fff"/><path d="M33 36h34l4 12H29zM25 60h50l4 12H21z" fill="#0d0d0e"/><rect x="8" y="84" width="84" height="8" fill="#fff"/></svg>
        <span>PYLON</span>
      </div>
    </div>

    <!-- 08 · Star / compass -->
    <div class="logo" data-id="compass">
      <div class="lg-compass">
        <svg viewBox="0 0 100 100" width="76" height="76"><circle cx="50" cy="50" r="44" fill="none" stroke="#fff" stroke-width="6"/><path d="M50 8 58 42 92 50 58 58 50 92 42 58 8 50 42 42z" fill="#fff"/></svg>
        <span>///PYL</span>
      </div>
    </div>

    <!-- 09 · Mono bracket -->
    <div class="logo" data-id="mono">
      <div class="lg-mono">[ PYLON ]</div>
    </div>

    <!-- 10 · Square monogram -->
    <div class="logo" data-id="monogram">
      <div class="lg-monogram"><span>P</span><small>PYLON</small></div>
    </div>

    <!-- 11 · Wide w/ orb O -->
    <div class="logo" data-id="orb-wide">
      <div class="lg-orbwide">PYL<span class="orb"></span>N</div>
    </div>

    <!-- 12 · Transmission tower -->
    <div class="logo" data-id="tower">
      <div class="lg-tower">
        <svg viewBox="0 0 100 120" width="70" height="84" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="miter"><path d="M50 4 30 116M50 4l20 112M22 30h56M14 52h72M38 30l24 22M62 30 38 52M34 76h32M36 52l28 24M64 52 36 76"/></svg>
        <span>PYLON</span>
      </div>
    </div>

    <!-- 13 · Lowercase grotesk -->
    <div class="logo" data-id="lower">
      <div class="lg-lower">pylon.</div>
    </div>

    <!-- 14 · Condensed stencil -->
    <div class="logo" data-id="condensed">
      <div class="lg-condensed">PY<b></b>LON<small>PRODUCTIONS</small></div>
    </div>

    <!-- 15 · Bold block w/ underline -->
    <div class="logo" data-id="block">
      <div class="lg-block">PYLON<span>FILMS&nbsp;&nbsp;·&nbsp;&nbsp;TORONTO</span></div>
    </div>

    <!-- FINAL · Placeholder final mark (swap when the final logo is locked) -->
    <div class="logo is-final" data-id="final">
      <svg class="final-mark" viewBox="0 0 512 512" width="132" height="132">
        <circle class="final-orb" cx="256" cy="105" r="36"/>
        <path class="final-body" fill-rule="evenodd" d="M231 160h50v45h75v32h-75v33h100v34H281l115 156h-56l-84-116-84 116h-56l115-156H131v-34h100v-33h-75v-32h75z"/>
      </svg>
    </div>

  </template>

  <!-- ============================================================
       SITE (placeholder landing — rebuilt step by step)
       ============================================================ -->
  <main id="site">
    <header class="nav">
      <div class="nav-left">
        <a href="#">Work</a>
        <a href="#">Who We Are</a>
        <a href="roster.html">Roster</a>
      </div>
      <div class="nav-right">
        <a href="#" class="nav-cta">Contact</a>
      </div>
    </header>

    <section class="hero">
      <h1 class="sr-only">Pylon</h1>

      <!-- Looping reel: full-bleed, sits behind the knockout band -->
      <video class="hero-video" id="heroVideo"
             src="assets/videos/home-reel-colour.mp4"
             poster="assets/images/home-reel-colour-poster.jpg"
             autoplay muted loop playsinline preload="auto"></video>

      <!-- Paper strip behind nav -->
      <div class="hero-navstrip"></div>

      <!-- Knockout band: paper with PYLON cut out, reel shows through -->
      <svg class="hero-knockout" viewBox="0 0 1000 232" preserveAspectRatio="xMidYMin meet" aria-hidden="true">
        <defs>
          <mask id="pylonCut" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="232">
            <rect width="1000" height="232" fill="#fff"/>
            <text x="500" y="214" text-anchor="middle"
                  textLength="968" lengthAdjust="spacingAndGlyphs"
                  font-family="Archivo Black, sans-serif" font-size="282"
                  fill="#000">PYLON</text>
          </mask>
        </defs>
        <rect width="1000" height="232" fill="#f4f3ef" mask="url(#pylonCut)"/>
      </svg>
    </section>

    <button class="replay" id="replayBtn" type="button">Replay intro</button>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
